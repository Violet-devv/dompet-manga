<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8203a">
<title>Dompet Manga</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#e9e6df;--paper:#fff;--ink:#111;--red:#e8203a;--green:#18a058;--mute:#777;--dots:rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#15131f}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:700;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:440px;background:var(--paper);background-image:radial-gradient(var(--dots) 1px,transparent 1.2px);background-size:6px 6px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 110px}
h1{font-family:Bangers,Impact,sans-serif;font-style:normal;font-size:34px;letter-spacing:.03em;text-shadow:3px 3px 0 var(--red)}
h2{font-size:22px;font-weight:800;text-transform:uppercase;margin:22px 0 10px}
.mo{display:flex;align-items:center;justify-content:space-between;margin:10px 0 18px}
.mo b{font-size:22px;font-weight:800}
.btn{border-radius:12px;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s;border:3px solid var(--ink);background:var(--paper);font:inherit;font-weight:800;font-size:18px;padding:6px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.red{background:var(--red);color:#fff}
.btn.sm{font-size:14px;padding:2px 8px;box-shadow:2px 2px 0 var(--ink)}
.panel{border-radius:20px;position:relative;border:3px solid var(--ink);background:var(--paper) repeating-conic-gradient(from 0deg at 62% 70%,rgba(0,0,0,.07) 0 1.2deg,transparent 1.2deg 6deg);padding:16px;box-shadow:5px 5px 0 var(--ink)}
.big{font-family:Bangers,Impact,sans-serif;font-style:normal;font-size:52px;line-height:1.05;text-shadow:3px 3px 0 var(--red)}
.bubble{position:absolute;right:-6px;top:-22px;background:var(--paper);border:3px solid var(--ink);border-radius:50% 46% 50% 44%;padding:4px 14px;font-family:Bangers,Impact,sans-serif;font-style:normal;font-size:22px;transform:rotate(6deg)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:17px;margin-top:6px}
.in{color:var(--green)}.out{color:var(--red)}
.card{border-radius:16px;transition:transform .15s;border:3px solid var(--ink);background:var(--paper);padding:10px 12px;margin-bottom:12px;box-shadow:4px 4px 0 var(--ink)}
.item{display:flex;align-items:center;gap:10px}
.ic{width:42px;height:42px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.n{flex:1;font-size:18px;font-weight:800;line-height:1.05;min-width:0}
.n small{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:18px;font-weight:800;white-space:nowrap}
.bar{border-radius:10px;overflow:hidden;height:12px;border:3px solid var(--ink);margin-top:8px;background:var(--paper)}
.bar i{display:block;height:100%;background:var(--red)}
label{display:block;font-size:15px;margin:12px 0 4px}
input,select{width:100%;border:3px solid var(--ink);background:var(--paper);font:inherit;font-size:20px;padding:8px 10px;color:var(--ink);border-radius:12px;transition:box-shadow .15s}
input:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(232,32,58,.35)}
.seg{display:flex;gap:10px}.seg .btn{flex:1}
.seg .btn.on.o{background:var(--red);color:#fff}.seg .btn.on.i{background:var(--green);color:#fff}
.empty{text-align:center;color:var(--mute);padding:18px 0;font-size:17px}
.legend{display:flex;align-items:center;gap:8px;font-size:16px;margin-top:6px}
.legend s{width:14px;height:14px;border:2px solid var(--ink);display:inline-block}
.legend span{flex:1}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--paper);border-top:3px solid var(--ink);border-radius:20px 20px 0 0;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{position:relative;overflow:hidden;border-radius:14px;flex:1;background:none;border:0;font:inherit;font-size:13px;color:var(--mute);display:grid;gap:0;justify-items:center;cursor:pointer}
nav button b{font-size:22px;font-weight:700}
nav button.on{color:var(--red)}
.big{display:inline-block;color:var(--ink);-webkit-text-stroke:2px var(--red);paint-order:stroke fill;animation:jit 4.5s infinite,pulse 3s ease-in-out infinite}
.big.neg{animation:jit 2.5s infinite}
.bubble{animation:wob 2.4s ease-in-out infinite}
.bar i{transform-origin:left;animation:grow .7s ease-out}
@keyframes jit{0%,86%,100%{transform:translate(0)}88%{transform:translate(-2px,1px)}90%{transform:translate(2px,-1px)}92%{transform:translate(-1px,-2px)}94%{transform:translate(2px,1px)}96%{transform:translate(-1px,0)}}
@keyframes pulse{0%,100%{text-shadow:3px 3px 0 var(--red),0 0 4px rgba(232,32,58,.2)}50%{text-shadow:5px 5px 0 var(--red),0 0 22px rgba(232,32,58,.8)}}
@keyframes wob{0%,100%{transform:rotate(6deg)}50%{transform:rotate(2deg) scale(1.06)}}
@keyframes grow{from{transform:scaleX(0)}}
h1{animation:glowH 2.8s ease-in-out infinite}
.amt.in{animation:glowG 3s ease-in-out infinite}
.ripple{position:absolute;border-radius:50%;background:rgba(232,32,58,.3);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
.btn.red .ripple{background:rgba(255,255,255,.55)}
.btn:active{transform:translate(3px,3px) scale(.97)}
nav button:active b{transform:scale(.85)}
nav button b{transition:transform .12s}
nav button.on b{animation:pop .4s ease-out}
.card:active{transform:scale(.98)}
#v>*{animation:fadeUp .4s ease-out backwards}
#v>*:nth-child(2){animation-delay:.05s}#v>*:nth-child(3){animation-delay:.1s}#v>*:nth-child(4){animation-delay:.15s}#v>*:nth-child(5){animation-delay:.2s}#v>*:nth-child(n+6){animation-delay:.25s}
.dn{display:block;margin:0 auto;animation:spinin .9s ease-out backwards}
.vb{transform-box:fill-box;transform-origin:bottom;animation:growY .6s ease-out backwards}
.line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease-out forwards}
.dot{transform-box:fill-box;transform-origin:center;animation:popin .4s 1.2s backwards}
.stk{display:flex;height:28px;border:3px solid var(--ink);border-radius:10px;overflow:hidden}
.stk i{display:block;height:100%;border-right:2px solid var(--ink);transform-origin:left;animation:grow .8s ease-out backwards}
@keyframes glowH{0%,100%{text-shadow:3px 3px 0 var(--red),0 0 4px rgba(232,32,58,.25)}50%{text-shadow:3px 3px 0 var(--red),0 0 18px rgba(232,32,58,.85)}}
@keyframes glowG{0%,100%{text-shadow:0 0 0 rgba(24,160,88,0)}50%{text-shadow:0 0 12px rgba(24,160,88,.7)}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes pop{50%{transform:scale(1.35)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes spinin{from{transform:rotate(-120deg) scale(.7);opacity:0}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes popin{from{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.line{stroke-dasharray:none;stroke-dashoffset:0}}
.msg{font-size:15px;color:var(--mute);margin-top:10px;font-style:normal;font-weight:700}
.toast{border-radius:12px;position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);background:var(--ink);color:#fff;padding:6px 18px;font-family:Bangers,Impact,sans-serif;font-style:normal;font-size:22px;transition:transform .25s;z-index:5}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app"><h1 id="ttl">DOMPET MANGA</h1><div id="v"></div></div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
var KEY='dompet-manga-v1';
var COLORS=['#e8203a','#111111','#f5a623','#18a058','#3b6cf6','#9b51e0','#e667a4','#00a3a3'];
var TABS=[['home','⌂','Beranda'],['add','＋','Catat'],['chart','◔','Grafik'],['cats','☰','Kategori'],['me','☺','Profil']];
var S={cats:[
  {id:'c1',name:'Makan',emoji:'🍴',type:'out'},{id:'c2',name:'Transport',emoji:'🚌',type:'out'},
  {id:'c3',name:'Hiburan',emoji:'🎮',type:'out'},{id:'c4',name:'Belanja',emoji:'🛍',type:'out'},
  {id:'c5',name:'Gaji',emoji:'💼',type:'in'},{id:'c6',name:'Bonus',emoji:'🎁',type:'in'}],tx:[]};
S.name='Dompet Manga';
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.name)S.name='Dompet Manga';

/* ===== DATABASE (Supabase) — isi 2 baris ini, lihat panduan SQL ===== */
var CFG={url:'',key:''};
var sb=(window.supabase&&CFG.url&&CFG.key)?supabase.createClient(CFG.url,CFG.key):null;
var user=null,syncMsg='',st;
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){localSave();if(sb&&user){clearTimeout(st);st=setTimeout(push,800)}}
async function push(){
  if(!sb||!user)return;
  var r=await sb.from('wallets').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});
  syncMsg=r.error?'Gagal simpan: '+r.error.message:'Tersinkron '+new Date().toLocaleTimeString('id-ID');
  if(tab==='me')render()}
async function pull(){
  var r=await sb.from('wallets').select('data').eq('user_id',user.id).maybeSingle();
  if(r.error){syncMsg='Gagal ambil data: '+r.error.message;return}
  if(r.data&&r.data.data){S=r.data.data;if(!S.name)S.name='Dompet Manga';localSave();syncMsg='Data dimuat dari database'}
  else await push()}
async function auth(mode){
  var em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value;
  if(!em||pw.length<6){toast('Email & sandi (min 6)!');return}
  var r=mode==='up'?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){toast('Gagal: '+r.error.message);return}
  if(!r.data.session){toast('Cek email untuk konfirmasi');return}
  user=r.data.user;await pull();render();toast('Masuk!')}
if(sb)sb.auth.getSession().then(function(r){user=r.data.session?r.data.session.user:null;if(user)pull().then(render)});
var tab='home',addType='out';
var today=new Date().toISOString().slice(0,10);
var ym=today.slice(0,7);

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rp(n){return 'Rp'+Math.round(n).toLocaleString('id-ID')}
function cat(id){return S.cats.find(function(c){return c.id===id})||{name:'(dihapus)',emoji:'❔',type:'out'}}
function shift(m,d){var p=m.split('-'),x=new Date(+p[0],+p[1]-1+d,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function mlabel(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}
function inMonth(m){return S.tx.filter(function(t){return t.date.slice(0,7)===m})}
function sum(list,type){return list.filter(function(t){return t.type===type}).reduce(function(a,t){return a+t.amt},0)}
function byCat(list,type){var m={};list.filter(function(t){return t.type===type}).forEach(function(t){m[t.cat]=(m[t.cat]||0)+t.amt});
  return Object.keys(m).map(function(k){return{id:k,v:m[k]}}).sort(function(a,b){return b.v-a.v})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1300)}

function monthBar(){return '<div class="mo"><button class="btn sm" data-a="prev">◀</button><b>'+mlabel(ym)+'</b><button class="btn sm" data-a="next">▶</button></div>'}

function home(){
  var l=inMonth(ym),i=sum(l,'in'),o=sum(l,'out'),sisa=i-o,tot=(+S.start||0)+sum(S.tx,'in')-sum(S.tx,'out'),cs=byCat(l,'out');
  var h=monthBar()+'<div class="panel"><div class="bubble">'+(sisa>=0?'HEMAT!':'BOROS!')+'</div><div>SALDO DOMPET</div><div class="big'+(tot<0?' neg':'')+'" data-v="'+tot+'">'+rp(tot)+'</div>'
   +'<div class="row"><span class="in">Masuk '+rp(i)+'</span><span class="out">Keluar '+rp(o)+'</span></div>'
   +'<div class="row"><span>Selisih bulan ini</span><b class="'+(sisa>=0?'in':'out')+'">'+(sisa>=0?'+':'−')+rp(Math.abs(sisa))+'</b></div>'
   +'<div class="row" style="color:var(--mute);font-size:15px"><span>Saldo awal</span><span>'+rp(+S.start||0)+'</span></div></div>';
  h+='<h2>Pengeluaran per kategori</h2>';
  if(!cs.length)h+='<div class="empty">Belum ada pengeluaran. Tap Catat untuk mulai.</div>';
  cs.forEach(function(c){var k=cat(c.id);h+='<div class="card"><div class="item"><div class="ic">'+esc(k.emoji)+'</div><div class="n">'+esc(k.name)+'<small>'+Math.round(c.v/o*100)+'% dari pengeluaran</small></div><div class="amt out">'+rp(c.v)+'</div></div><div class="bar"><i style="width:'+(c.v/o*100)+'%"></i></div></div>'});
  h+='<h2>Riwayat</h2>';
  if(!l.length)h+='<div class="empty">Kosong.</div>';
  l.slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)}).forEach(function(t){var k=cat(t.cat);
    h+='<div class="card"><div class="item"><div class="ic">'+esc(k.emoji)+'</div><div class="n">'+esc(t.note||k.name)+'<small>'+esc(k.name)+' · '+t.date.slice(8)+'/'+t.date.slice(5,7)+'</small></div><div class="amt '+t.type+'">'+(t.type==='in'?'+':'−')+rp(t.amt)+'</div><button class="btn sm" data-a="del" data-id="'+t.id+'" aria-label="Hapus">✕</button></div></div>'});
  return h}

function add(){
  var opts=S.cats.filter(function(c){return c.type===addType}).map(function(c){return '<option value="'+c.id+'">'+esc(c.emoji+' '+c.name)+'</option>'}).join('');
  return '<h2>Catat transaksi</h2><div class="seg"><button class="btn o'+(addType==='out'?' on':'')+'" data-a="type" data-v="out">Pengeluaran</button><button class="btn i'+(addType==='in'?' on':'')+'" data-a="type" data-v="in">Pemasukan</button></div>'
  +'<form id="f"><label>Jumlah (Rp)</label><input id="amt" type="number" inputmode="numeric" min="1" required placeholder="25000">'
  +'<label>Kategori</label><select id="cat">'+(opts||'<option value="">Buat kategori dulu</option>')+'</select>'
  +'<label>Catatan (opsional)</label><input id="note" maxlength="60" placeholder="Nasi goreng">'
  +'<label>Tanggal</label><input id="date" type="date" value="'+today+'" required>'
  +'<div style="margin-top:18px"><button class="btn red" style="width:100%" type="submit">Simpan</button></div></form>'}

function extraCharts(l){
  var p=ym.split('-'),days=new Date(+p[0],+p[1],0).getDate(),first=ym+'-01',h='',d;
  var b0=+S.start||0;S.tx.forEach(function(t){if(t.date<first)b0+=t.type==='in'?t.amt:-t.amt});
  var dIn=[],dOut=[],bal=[],r=b0;
  for(d=1;d<=days;d++){dIn[d]=0;dOut[d]=0}
  l.forEach(function(t){var x=+t.date.slice(8);if(t.type==='in')dIn[x]+=t.amt;else dOut[x]+=t.amt});
  for(d=1;d<=days;d++){r+=dIn[d]-dOut[d];bal[d]=r}
  var all=[b0].concat(bal.slice(1)),mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);if(mx===mn){mx+=1;mn-=1}
  function X(k){return 12+(k-1)/Math.max(days-1,1)*276}
  function Y(v){return 105-(v-mn)/(mx-mn)*90}
  var pts=[];for(d=1;d<=days;d++)pts.push(X(d).toFixed(1)+','+Y(bal[d]).toFixed(1));
  h+='<h2>Tren saldo harian</h2><div class="card"><svg viewBox="0 0 300 125" width="100%" style="display:block"><path d="M12,115 L'+pts.join(' L')+' L288,115 Z" fill="rgba(232,32,58,.15)"/><polyline class="line" pathLength="1" points="'+pts.join(' ')+'" fill="none" stroke="#e8203a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle class="dot" cx="'+X(days)+'" cy="'+Y(bal[days])+'" r="5" fill="#fff" stroke="#111" stroke-width="3"/></svg><div class="row"><span>Awal '+rp(b0)+'</span><b>Akhir '+rp(bal[days])+'</b></div></div>';
  var mo=Math.max.apply(null,dOut.slice(1).concat([1])),bw=276/days,bs='';
  for(d=1;d<=days;d++){if(!dOut[d])continue;var hh=dOut[d]/mo*90;bs+='<rect class="vb" style="animation-delay:'+(d*18)+'ms" x="'+(12+(d-1)*bw+1)+'" y="'+(105-hh)+'" width="'+Math.max(bw-2,2)+'" height="'+hh+'" rx="2" fill="#e8203a" stroke="#111" stroke-width="1.2"/>'}
  h+='<h2>Pengeluaran per hari</h2><div class="card"><svg viewBox="0 0 300 125" width="100%" style="display:block"><line x1="8" y1="105" x2="292" y2="105" stroke="#111" stroke-width="3"/>'+bs+[1,Math.ceil(days/2),days].map(function(x){return '<text x="'+(12+(x-1)*bw+bw/2)+'" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">'+x+'</text>'}).join('')+'</svg></div>';
  var ci=byCat(l,'in'),ti=sum(l,'in');
  if(ci.length){var sg='',lg2='',cc=['#18a058','#3b6cf6','#f5a623','#9b51e0','#00a3a3'];
    ci.forEach(function(c,k){var col=cc[k%5];sg+='<i style="width:'+(c.v/ti*100)+'%;background:'+col+'"></i>';lg2+='<div class="legend"><s style="background:'+col+'"></s><span>'+esc(cat(c.id).emoji+' '+cat(c.id).name)+'</span><b>'+rp(c.v)+'</b></div>'});
    h+='<h2>Sumber pemasukan</h2><div class="card"><div class="stk">'+sg+'</div>'+lg2+'</div>'}
  return h}

function chart(){
  var l=inMonth(ym),cs=byCat(l,'out'),o=sum(l,'out'),h=monthBar()+'<h2>Pengeluaran per kategori</h2>';
  if(!cs.length)h+='<div class="empty">Belum ada data bulan ini.</div>';
  else{var off=0,svg='<svg class="dn" viewBox="0 0 42 42" width="200" height="200" style="display:block;margin:0 auto"><circle cx="21" cy="21" r="15.915" fill="none" stroke="#ddd" stroke-width="7"/>',lg='';
    cs.forEach(function(c,i){var p=c.v/o*100,col=COLORS[i%COLORS.length];
      svg+='<circle cx="21" cy="21" r="15.915" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+(25-off)+'"/>';off+=p;
      lg+='<div class="legend"><s style="background:'+col+'"></s><span>'+esc(cat(c.id).emoji+' '+cat(c.id).name)+'</span><b>'+Math.round(p)+'% · '+rp(c.v)+'</b></div>'});
    svg+='<circle cx="21" cy="21" r="18.9" fill="none" stroke="#111" stroke-width=".5"/><circle cx="21" cy="21" r="12.1" fill="none" stroke="#111" stroke-width=".5"/></svg>';
    h+='<div class="card">'+svg+lg+'</div>'}
  h+=extraCharts(l)+'<h2>6 bulan terakhir</h2>';
  var ms=[];for(var k=5;k>=0;k--)ms.push(shift(ym,-k));
  var data=ms.map(function(m){var x=inMonth(m);return{m:m,i:sum(x,'in'),o:sum(x,'out')}});
  var mx=Math.max.apply(null,data.map(function(d){return Math.max(d.i,d.o)}).concat([1]));
  var b='<svg viewBox="0 0 300 150" width="100%" style="display:block"><line x1="0" y1="120" x2="300" y2="120" stroke="#111" stroke-width="3"/>';
  data.forEach(function(d,k){var x=k*50+6,hi=d.i/mx*105,ho=d.o/mx*105;
    b+='<rect x="'+x+'" y="'+(120-hi)+'" width="18" height="'+hi+'" rx="3" class="vb" fill="#18a058" stroke="#111" stroke-width="2"/><rect x="'+(x+20)+'" y="'+(120-ho)+'" width="18" height="'+ho+'" rx="3" class="vb" fill="#e8203a" stroke="#111" stroke-width="2"/>'
    +'<text x="'+(x+19)+'" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">'+new Date(+d.m.slice(0,4),+d.m.slice(5)-1,1).toLocaleDateString('id-ID',{month:'short'})+'</text>'});
  b+='</svg><div class="legend"><s style="background:#18a058"></s><span>Pemasukan</span><s style="background:#e8203a"></s><span>Pengeluaran</span></div>';
  return h+'<div class="card">'+b+'</div>'}

function cats(){
  var h='<h2>Tambah kategori</h2><form id="cf"><div style="display:flex;gap:10px"><div style="width:90px"><label>Emoji</label><input id="ce" maxlength="4" value="📦" required></div><div style="flex:1"><label>Nama</label><input id="cn" maxlength="20" required placeholder="Kopi"></div></div>'
   +'<label>Jenis</label><select id="ct"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option></select><div style="margin-top:14px"><button class="btn red" style="width:100%" type="submit">Tambah</button></div></form><h2>Daftar kategori</h2>';
  S.cats.forEach(function(c){h+='<div class="card"><div class="item"><div class="ic">'+esc(c.emoji)+'</div><div class="n">'+esc(c.name)+'<small>'+(c.type==='in'?'Pemasukan':'Pengeluaran')+'</small></div><button class="btn sm" data-a="delcat" data-id="'+c.id+'">Hapus</button></div></div>'});
  return h+'<h2>Data</h2><button class="btn" data-a="export" style="width:100%">Unduh cadangan (JSON)</button>'}

function profile(){
  var h='<h2>Nama dompet</h2><form id="nf"><input id="wn" maxlength="24" value="'+esc(S.name)+'" required><div style="margin-top:14px"><button class="btn red" style="width:100%" type="submit">Simpan nama</button></div></form><h2>Saldo awal</h2><form id="sf"><input id="sa" type="number" inputmode="decimal" value="'+(+S.start||0)+'" required><div style="margin-top:14px"><button class="btn red" style="width:100%" type="submit">Simpan saldo awal</button></div></form><h2>Akun</h2>';
  if(!sb)h+='<div class="card"><div class="n">Database belum tersambung<small style="white-space:normal">Isi CFG.url dan CFG.key di index.html (lihat panduan Supabase). Sementara data hanya tersimpan di perangkat ini.</small></div></div>';
  else if(user)h+='<div class="card"><div class="item"><div class="ic">☺</div><div class="n">'+esc(user.email)+'<small>Masuk · data otomatis tersimpan ke database</small></div></div></div><div class="seg"><button class="btn" data-a="sync">Sinkron</button><button class="btn" data-a="logout">Keluar</button></div>';
  else h+='<form id="lf"><label>Email</label><input id="em" type="email" autocomplete="email" required><label>Sandi</label><input id="pw" type="password" autocomplete="current-password" minlength="6" required><div class="seg" style="margin-top:14px"><button class="btn red" type="submit">Masuk</button><button class="btn" type="button" data-a="signup">Daftar</button></div></form>';
  if(syncMsg)h+='<div class="msg">'+esc(syncMsg)+'</div>';
  return h}

var lastBig=null;
function countUp(){
  var el=document.querySelector('.big[data-v]');if(!el)return;
  var to=+el.dataset.v,from=lastBig==null?0:lastBig;lastBig=to;
  if(from===to||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var t0=performance.now();
  (function f(t){var k=Math.min((t-t0)/700,1),e=1-Math.pow(1-k,3);
    el.textContent=rp(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}

function render(){
  document.getElementById('v').innerHTML={home:home,add:add,chart:chart,cats:cats,me:profile}[tab]();
  document.getElementById('ttl').textContent=S.name.toUpperCase();document.title=S.name;countUp();
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button data-a="tab" data-v="'+t[0]+'"'+(tab===t[0]?' class="on"':'')+'><b>'+t[1]+'</b>'+t[2]+'</button>'}).join('');
  var f=document.getElementById('f');if(f)f.onsubmit=function(e){e.preventDefault();
    var c=document.getElementById('cat').value;if(!c){toast('Pilih kategori!');return}
    var d=document.getElementById('date').value;
    S.tx.push({id:Date.now().toString(36),type:addType,amt:+document.getElementById('amt').value,cat:c,note:document.getElementById('note').value.trim(),date:d});
    save();ym=d.slice(0,7);tab='home';render();toast('Tersimpan!')};
  var cf=document.getElementById('cf');if(cf)cf.onsubmit=function(e){e.preventDefault();
    S.cats.push({id:'c'+Date.now().toString(36),name:document.getElementById('cn').value.trim(),emoji:document.getElementById('ce').value.trim(),type:document.getElementById('ct').value});
    save();render();toast('Kategori ditambah!')};
  var nf=document.getElementById('nf');if(nf)nf.onsubmit=function(e){e.preventDefault();S.name=document.getElementById('wn').value.trim()||'Dompet Manga';save();render();toast('Nama disimpan!')};
  var sf=document.getElementById('sf');if(sf)sf.onsubmit=function(e){e.preventDefault();S.start=+document.getElementById('sa').value||0;save();render();toast('Saldo awal disimpan!')};
  var lf=document.getElementById('lf');if(lf)lf.onsubmit=function(e){e.preventDefault();auth('in')}}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a;
  if(a==='tab'){tab=el.dataset.v;window.scrollTo(0,0)}
  else if(a==='type')addType=el.dataset.v;
  else if(a==='prev')ym=shift(ym,-1);
  else if(a==='next')ym=shift(ym,1);
  else if(a==='del'){if(!confirm('Hapus transaksi ini?'))return;S.tx=S.tx.filter(function(t){return t.id!==el.dataset.id});save()}
  else if(a==='delcat'){var id=el.dataset.id;
    if(S.tx.some(function(t){return t.cat===id})){toast('Masih dipakai transaksi!');return}
    S.cats=S.cats.filter(function(c){return c.id!==id});save()}
  else if(a==='signup'){auth('up');return}
  else if(a==='logout'){sb.auth.signOut().then(function(){user=null;syncMsg='';render();toast('Keluar')});return}
  else if(a==='sync'){push();return}
  else if(a==='export'){var u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),k=document.createElement('a');k.href=u;k.download='dompet-manga.json';k.click();return}
  render()});
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.btn,nav button');if(!el)return;
  var r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,sp=document.createElement('span');
  sp.className='ripple';sp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  el.appendChild(sp);setTimeout(function(){sp.remove()},600)});
render();
</script>
</body>
</html>
